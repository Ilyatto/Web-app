{% extends "base.html" %}

{% block content %}
<form method="post" class="panel form small-form">
  {% csrf_token %}
  <h1>Регистрация</h1>
  <p>
    <label>Логин</label>
    <input type="text" name="username" required>
  </p>
  <p>
    <label>Пароль</label>
    <input type="password" name="password" required>
  </p>
  <p>
    <label>Повторите пароль</label>
    <input type="password" name="password2" required>
  </p>
  <button type="submit" class="btn">Создать аккаунт</button>
  <p class="gray">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</form>
{% endblock %}
