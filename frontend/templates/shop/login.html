{% extends "base.html" %}

{% block content %}
<form method="post" class="panel form small-form">
  {% csrf_token %}
  <h1>Вход</h1>
  <p>
    <label>Логин</label>
    <input type="text" name="username" required>
  </p>
  <p>
    <label>Пароль</label>
    <input type="password" name="password" required>
  </p>
  <button type="submit" class="btn">Войти</button>
</form>
{% endblock %}
